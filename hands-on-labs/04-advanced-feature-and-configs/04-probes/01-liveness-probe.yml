apiVersion: v1
kind: Pod
metadata:
  name: liveness-probe-demo
  namespace: probes-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.25.3
      ports:
        - containerPort: 80
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5   # Wait 5s before first check (let container start)
        periodSeconds: 10        # Check every 10s
        failureThreshold: 3      # Restart after 3 consecutive failures
