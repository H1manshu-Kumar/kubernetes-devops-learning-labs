apiVersion: v1
kind: Pod
metadata:
  name: readiness-probe-demo
  namespace: probes-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.25.3
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 3   # Wait 3s before first check
        periodSeconds: 5         # Check every 5s
        failureThreshold: 3      # Remove from Service endpoints after 3 failures
        successThreshold: 1      # Mark ready after 1 success
