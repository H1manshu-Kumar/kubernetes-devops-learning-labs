apiVersion: v1
kind: Pod
metadata:
  name: all-probes-demo
  namespace: probes-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.25.3
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"

      # 1. startupProbe — gates liveness/readiness until container is up
      startupProbe:
        httpGet:
          path: /
          port: 80
        failureThreshold: 30
        periodSeconds: 10

      # 2. livenessProbe — restarts container if it becomes unhealthy
      livenessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 3

      # 3. readinessProbe — controls whether pod receives traffic
      readinessProbe:
        httpGet:
          path: /
          port: 80
        initialDelaySeconds: 3
        periodSeconds: 5
        failureThreshold: 3
        successThreshold: 1
