apiVersion: v1
kind: Pod
metadata:
  name: startup-probe-demo
  namespace: probes-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.25.3
      ports:
        - containerPort: 80
      startupProbe:
        httpGet:
          path: /
          port: 80
        failureThreshold: 30     # Allow up to 30 * 10s = 5 minutes for slow startup
        periodSeconds: 10
      livenessProbe:             # Only kicks in AFTER startupProbe succeeds
        httpGet:
          path: /
          port: 80
        periodSeconds: 10
        failureThreshold: 3
