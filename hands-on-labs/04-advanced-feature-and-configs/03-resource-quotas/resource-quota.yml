apiVersion: v1
kind: Namespace
metadata:
  name: quota-demo

---
# ResourceQuota - limits total resource consumption in the namespace
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-quota
  namespace: quota-demo
spec:
  hard:
    # Compute resources
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "1"
    limits.memory: "1Gi"
    # Object count limits
    pods: "5"
    services: "3"
    configmaps: "5"
    secrets: "5"
    persistentvolumeclaims: "3"

---
# LimitRange - sets default requests/limits per container so pods aren't rejected
apiVersion: v1
kind: LimitRange
metadata:
  name: demo-limitrange
  namespace: quota-demo
spec:
  limits:
    - type: Container
      default:          # applied as limit if not specified
        cpu: "200m"
        memory: "256Mi"
      defaultRequest:   # applied as request if not specified
        cpu: "100m"
        memory: "128Mi"
      max:              # container cannot exceed these
        cpu: "500m"
        memory: "512Mi"
      min:              # container must request at least these
        cpu: "50m"
        memory: "64Mi"

---
# A well-configured Pod that fits within the quota
apiVersion: v1
kind: Pod
metadata:
  name: quota-compliant-pod
  namespace: quota-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.25.3
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "200m"
          memory: "256Mi"
